{% extends 'base.html' %}

{% block title %}Documento Gerado com Sucesso{% endblock %}

{% block content %}
<div class="card text-center">
    <div class="card-header">
        <h3>Documento Gerado com Sucesso!</h3>
    </div>
    <div class="card-body">
        <div class="text-center py-4">
            <h5 class="card-title">Seu documento está pronto para download.</h5>
            <p class="card-text">Clique no botão abaixo para baixar o arquivo .DOCX.</p>
            <a href="{{ url_for('documentos.download_file', filetype='docx', filename_base=filename_base) }}" class="btn btn-primary btn-lg mt-3">
                <i class="bi bi-file-earmark-word-fill"></i> Download .DOCX
            </a>
        </div>
    </div>
    <div class="card-footer text-muted text-center">
        <a href="{{ url_for('documentos.gerar_documento') }}">Gerar outro documento</a>
    </div>
</div>
{% endblock %}
